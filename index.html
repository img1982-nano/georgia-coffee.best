<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 検索結果に表示されるサイトの説明文（ディスクリプション）を追加しました -->
    <meta name="description" content="ジョージア オリジナルの缶コーヒーの魅力について語ったサイトです">
    <!-- タイトルをより具体的なものに変更しました -->
    <title>GeorgiaCoffee Is Best</title>
    
    <!-- SNSシェア用のOGP設定を追加 -->
    <meta property="og:title" content="GeorgiaCoffee is Best">
    <meta property="og:type" content="website">
    <meta property="og:image" content="image_5c8817.png">
    <meta property="og:description" content="georgiacoffee is Best">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* 0.2秒周期で無限にレインボーカラーをループさせる */
            animation: rainbowFlash 0.2s infinite;
        }

        /* レインボーカラーのアニメーションキーフレーム */
        @keyframes rainbowFlash {
            0% { background-color: red; }
            14% { background-color: orange; }
            28% { background-color: yellow; }
            42% { background-color: green; }
            57% { background-color: blue; }
            71% { background-color: indigo; }
            85% { background-color: violet; }
            100% { background-color: red; }
        }

        /* 画面サイズに合わせて画像がはみ出さないように調整 */
        img {
            max-width: 80%;
            max-height: 80vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <!-- 画像のalt属性は検索エンジンが画像を理解するために重要です（設定済み） -->
    <img src="image_5c8817.png" alt="ジョージア オリジナルの缶コーヒー">
</body>
</html>
